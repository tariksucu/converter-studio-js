name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Dependencies' install scripts are not needed to lint, build or test.
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: ESLint, Prettier and TypeScript (with the type tests)
        run: 'npm run lint'

      - name: Build, then publint and Are the Types Wrong on the packed package
        run: 'npm run check:package'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The checks JSR runs on publishing: slow types, the files that go.
      - name: JSR dry run
        run: 'deno publish --dry-run'

      # JSR's score counts the documented symbols.
      - name: Every exported symbol is documented
        run: 'deno doc --lint src/index.ts'

  test:
    name: Tests (Node.js ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24', '26']
        include:
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      # Unit tests with a fake API behind fetch: no network, no API key.
      - name: Run tests
        run: 'npm test'

  runtimes:
    name: Tests (Deno and Bun)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run tests in Deno
        run: 'deno test -A test/'

      - name: Run tests in Bun
        run: 'bun test test/'
